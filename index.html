<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name | Digital Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <h1>Your Name</h1>
            <p>Creative Developer & Digital Artist</p>
        </div>
    </header>

    <main>
        <div class="container">
            <h2>My Projects</h2>
            <div id="project-grid" class="project-grid">
                </div>
        </div>
    </main>

    <div id="project-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <img id="modal-img" src="" alt="Project Image">
            <h3 id="modal-title"></h3>
            <div id="modal-tags"></div>
            <p id="modal-description"></p>
            <a id="modal-link" href="#" target="_blank" class="btn-live">View Live Project</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
